<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to namtiw.github.io</title>
<link rel="canonical" href="https://namtiw.github.io/">
<meta http-equiv="refresh" content="0; url=https://namtiw.github.io/">
<script>
  (function () {
    var TARGET_HOST = "namtiw.github.io";
    if (window.location.hostname === TARGET_HOST) return;
    var path = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace("https://" + TARGET_HOST + path);
  })();
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0F172A;
    color: #E2E8F0;
  }
  main { text-align: center; padding: 1.5rem; }
  a { color: #38BDF8; }
</style>
</head>
<body>
<main>
  <h1>This site has moved</h1>
  <p>Redirecting to <a href="https://namtiw.github.io/">namtiw.github.io</a>&hellip;</p>
</main>
</body>
</html>
